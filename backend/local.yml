name: learnbuild

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: learnbuild-api
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://learnbuild:learnbuild_dev@learnbuild-postgres:5432/learnbuild
      REDIS_URL: redis://learnbuild-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnbuild-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: learnbuild-postgres
    volumes:
      - learnbuild-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: learnbuild
      POSTGRES_PASSWORD: learnbuild_dev
      POSTGRES_DB: learnbuild
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnbuild"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnbuild-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: learnbuild-redis
    volumes:
      - learnbuild-redis-data:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learnbuild-network
    restart: unless-stopped

volumes:
  learnbuild-postgres-data:
    name: learnbuild-postgres-data
  learnbuild-redis-data:
    name: learnbuild-redis-data

networks:
  learnbuild-network:
    name: learnbuild-network
